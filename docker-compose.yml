version: '3.9'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=22-alpine3.22
        - NODE_ENV=production
    container_name: shadow-monarch-portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - portfolio-network
    volumes:
      # Persist uploads
      - ./public/uploads:/app/public/uploads
    labels:
      - "com.docker.compose.project=shadow-monarch-portfolio"
      - "maintainer=Matheus Sobral"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  portfolio-network:
    driver: bridge

volumes:
  uploads:
    driver: local